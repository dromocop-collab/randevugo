version: 2
# Ayda bir, ayın ilk pazartesi; küçük güncellemeler tek PR'da toplanır (daha az CI maili).
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      web-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
      time: "06:15"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      function-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
